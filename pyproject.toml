[project]
name = "localflow"
version = "0.3.1"
description = "Standalone local Wispr Flow alternative for Windows (PySide6 + faster-whisper + embedded llama.cpp / Ollama)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "LocalFlow Contributors" },
]
keywords = [
    "whisper",
    "faster-whisper",
    "speech-to-text",
    "voice-dictation",
    "voice-typing",
    "llama-cpp",
    "ollama",
    "wispr-flow",
    "pyside6",
    "windows",
    "local-ai",
    "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8.0",
    "faster-whisper>=1.1.0",
    "sounddevice>=0.5.1",
    "numpy>=2.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pyaudiowpatch>=0.2.12.9",
]

[project.scripts]
localflow = "localflow.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-qt>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
